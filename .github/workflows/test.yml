name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install aiosqlite pytest pytest-asyncio httpx

      - name: Run pytest suite
        run: |
          pytest test_autonomous.py -v
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
          LLM_PROVIDER: none

      - name: Run stress test
        run: |
          # Стресс-тест требует реально запущенный сервер С уже созданными таблицами
          python -c "
          import asyncio
          from app.core.database import Base, engine
          from app.models import models
          async def init():
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
          asyncio.run(init())
          "
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            curl -s -o /dev/null http://127.0.0.1:8000/api/health && break
            sleep 0.5
          done
          python stress_test.py
          kill $SERVER_PID
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_stress.db
          LLM_PROVIDER: none

  docker-build:
    # Отдельная job: раньше CI вообще не собирал Dockerfile — тесты выше
    # гоняются напрямую на раннере, минуя Docker. Это значит, что любая
    # ошибка именно в Dockerfile всплыла бы только на живом деплое Render,
    # а не в CI.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tvoy_golos
          POSTGRES_PASSWORD: tvoy_golos
          POSTGRES_DB: tvoy_golos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tvoy_golos"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tvoy-golos-api:ci .

      - name: Smoke test — контейнер реально стартует и отвечает на /api/health
        run: |
          # Реальный Postgres (не SQLite): production-образ ставит только
          # asyncpg (см. requirements.txt), aiosqlite там намеренно нет —
          # это ловилось здесь ранее (первая версия этого job'а ошибочно
          # пробовала поднять sqlite+aiosqlite, которого в образе не было,
          # и падала с ModuleNotFoundError, не имея отношения к самому
          # приложению). --network host, чтобы контейнер видел сервис
          # postgres на localhost:5432, как обычный процесс на раннере.
          docker run -d --name smoke-test --network host \
            -e DATABASE_URL=postgresql+asyncpg://tvoy_golos:tvoy_golos@localhost:5432/tvoy_golos_ci \
            -e LLM_PROVIDER=none \
            -e FRONTEND_ORIGIN=http://localhost:5173 \
            -e ENV=development \
            tvoy-golos-api:ci
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/health || (docker logs smoke-test && exit 1)
          docker logs smoke-test
          docker stop smoke-test
